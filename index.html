<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hall of Worlds</title>
        <!-- The memory log, only with ?memlog in the address: first, so it sees
             everything the game makes (web/memlog.js). -->
        <link data-trunk rel="copy-file" href="web/memlog.js" />
        <script src="memlog.js"></script>
        <!-- Tells Trunk to compile the Rust crate to WebAssembly and load it,
             filling the loading bar as it goes (web/loader.js). -->
        <link data-trunk rel="rust" href="crates/client/Cargo.toml" data-bin="hall-of-worlds" data-wasm-opt="s" data-initializer="web/loader.js" />
        <link data-trunk rel="copy-dir" href="crates/client/assets" />
        <!-- The HW icon, drawn by `cargo xtask app-icon`. -->
        <link rel="icon" type="image/png" sizes="16x16" href="assets/app_icon/icon-16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="assets/app_icon/icon-32.png" />
        <link rel="icon" type="image/png" sizes="48x48" href="assets/app_icon/icon-48.png" />
        <link rel="icon" type="image/png" sizes="256x256" href="assets/app_icon/icon-256.png" />
        <link rel="apple-touch-icon" href="assets/app_icon/apple-touch-icon.png" />
        <link rel="preload" href="assets/fonts/HallOfWorldsTitle.ttf" as="font" type="font/ttf" crossorigin />
        <style>
            @font-face {
                font-family: "Hall of Worlds Title";
                src: url("assets/fonts/HallOfWorldsTitle.ttf");
            }
            @font-face {
                font-family: "Lexend";
                src: url("assets/fonts/Lexend-Variable.ttf");
                font-weight: 100 900;
                font-display: swap;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
                overscroll-behavior: none;
            }
            #game {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
                /* The game has its own gestures: the browser mustn't scroll or
                   zoom the page, or select or offer to save the picture. */
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }
            /* The download's loading screen, until the game has drawn its own: the
               colours and sizes are copied from crates/client/src/loading_screen. */
            #loading,
            #ended {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0a0812;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }
            /* After quitting, the same screen with a button in place of the bar:
               shown by crates/client/src/system_menu. */
            #ended[hidden] {
                display: none;
            }
            #loading-title {
                /* Hidden until its font has loaded, so it never shows in another. */
                visibility: hidden;
            }
            #loading-title,
            #ended-title {
                font: min(17.35vw, 20.83vh) / 1.2 "Hall of Worlds Title", serif;
                text-align: center;
                color: #edbf61;
                text-shadow: 3px 3px #591f0d;
            }
            #loading-bar,
            #reload {
                position: absolute;
                left: 32px;
                right: 32px;
                bottom: 32px;
                height: 32px;
                text-align: center;
                font: 18px/32px "Lexend", sans-serif;
                color: #f2ebd9;
                background: #211c29;
            }
            #reload {
                padding: 0;
                border: 1px solid #edbf61;
                cursor: pointer;
            }
            /* The bar fills from the left (web/loader.js) in the game's own
               colours, and a pale stripe slides along it the whole time. Both
               move by transform only, so they keep moving while the page's
               thread is busy compiling and starting the game. */
            #loading-bar {
                overflow: hidden;
            }
            #loading-fill,
            #loading-stripe {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }
            #loading-fill {
                background: rgba(237, 191, 97, 0.45);
                transform: scaleX(0);
                transform-origin: left;
            }
            #loading-stripe {
                width: 25%;
                background: linear-gradient(90deg, transparent, rgba(242, 235, 217, 0.12), transparent);
                animation: loading-slide 1.6s linear infinite;
                will-change: transform;
            }
            #loading-bar.failed #loading-stripe {
                display: none;
            }
            #loading-words {
                position: relative;
            }
            @keyframes loading-slide {
                from { transform: translateX(-100%); }
                to { transform: translateX(400%); }
            }
        </style>
        <script>
            // Whether the browser would draw without a graphics card: it refuses
            // WebGL when asked to fail on a "major performance caveat", yet gives
            // it without. Read by the game (crates/client/src/system_menu/slow_drawing.rs).
            (() => {
                const context = (options) => document.createElement("canvas").getContext("webgl2", options);
                const done = (gl) => gl?.getExtension("WEBGL_lose_context")?.loseContext();
                const fast = context({ failIfMajorPerformanceCaveat: true });
                const any = fast || context();
                window.howSlowDrawing = !fast && !!any;
                done(any);
            })();
        </script>
        <script>
            // Browsers start sound only after a click, tap or key, and the game's
            // audio is set up before that, so it starts suspended: resume it then.
            // The music itself waits for the same (crates/client/src/music/gesture.rs).
            (() => {
                const Original = window.AudioContext || window.webkitAudioContext;
                if (!Original) return;
                const contexts = [];
                const Tracked = function (...args) {
                    const context = new Original(...args);
                    contexts.push(context);
                    return context;
                };
                Tracked.prototype = Original.prototype;
                window.AudioContext = Tracked;
                const resume = () => {
                    contexts.forEach((context) => context.state === "suspended" && context.resume());
                    if (contexts.length && contexts.every((context) => context.state === "running")) {
                        ["pointerup", "keyup", "touchend"].forEach((name) => document.removeEventListener(name, resume, true));
                    }
                };
                ["pointerup", "keyup", "touchend"].forEach((name) => document.addEventListener(name, resume, true));
            })();
        </script>
        <script>
            // Safari's own pinch zoom, which it may start despite touch-action.
            document.addEventListener("gesturestart", (event) => event.preventDefault());
        </script>
    </head>
    <body>
        <canvas id="game"></canvas>
        <div id="loading">
            <div id="loading-title">Hall of<br />Worlds</div>
            <div id="loading-bar"><div id="loading-fill"></div><div id="loading-stripe"></div><span id="loading-words">Downloading...</span></div>
        </div>
        <div id="ended" hidden>
            <div id="ended-title">Hall of<br />Worlds</div>
            <button id="reload" type="button" onclick="location.reload()">Click to reload</button>
        </div>
        <script>
            // If the font can't load, the title still shows, in the fallback.
            document.fonts.load('1em "Hall of Worlds Title"').finally(() => {
                document.getElementById("loading-title").style.visibility = "visible";
            });
        </script>
    </body>
</html>
